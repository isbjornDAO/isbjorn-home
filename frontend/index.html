<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/iggy-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Isbjorn - Business donations for polar bear conservation. Transparent, efficient, and impactful giving powered by blockchain technology." />
  <meta property="og:title" content="Isbjorn" />
  <meta property="og:description"
    content="Join businesses worldwide in supporting polar bear conservation through transparent, blockchain-powered donations." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:url" content="https://donate.isbjorn.co.nz" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <title>Isbjorn</title>
  <script>
    if (typeof global === 'undefined') {
      window.global = window;
    }
  </script>
  <!-- Startup Error Logger -->
  <script>
    window.onerror = function (msg, url, line, col, error) {
      document.getElementById('startup-error').style.display = 'block';
      document.getElementById('error-content').innerText += `\nError: ${msg}\nAt: ${url}:${line}:${col}\n${error ? error.stack : ''}\n`;
    };
    window.onunhandledrejection = function (e) {
      document.getElementById('startup-error').style.display = 'block';
      document.getElementById('error-content').innerText += `\nPromise Rejection: ${e.reason}\n`;
    };
  </script>
  <style>
    #startup-error {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      color: red;
      z-index: 99999;
      padding: 20px;
      overflow: auto;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div id="startup-error">
    <h1>Startup Error</h1>
    <div id="error-content"></div>
  </div>
  <noscript>
    <div style="padding: 20px; text-align: center;">
      <h1>JavaScript Required</h1>
      <p>Please enable JavaScript to view this application.</p>
    </div>
  </noscript>
  <div id="root">
    <div
      style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: white;">
      Loading Isbjorn...
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
