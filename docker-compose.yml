version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: isbjorn_postgres
    environment:
      POSTGRES_DB: isbjorn_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    networks:
      - isbjorn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: isbjorn_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - isbjorn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isbjorn_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: isbjorn_dev
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      JWT_EXPIRES_IN: 7d
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@isbjorn.co.nz}
      AVALANCHE_RPC_URL: ${AVALANCHE_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
      AVALANCHE_CHAIN_ID: ${AVALANCHE_CHAIN_ID:-43113}
      AVALANCHE_PRIVATE_KEY: ${AVALANCHE_PRIVATE_KEY}
      DONATION_TRACKER_ADDRESS: ${DONATION_TRACKER_ADDRESS}
      PROJECT_DISTRIBUTION_ADDRESS: ${PROJECT_DISTRIBUTION_ADDRESS}
      ADMIN_MULTISIG_ADDRESS: ${ADMIN_MULTISIG_ADDRESS}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - isbjorn_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
        VITE_AVALANCHE_RPC_URL: ${VITE_AVALANCHE_RPC_URL:-https://api.avax-test.network/ext/bc/C/rpc}
        VITE_AVALANCHE_CHAIN_ID: ${VITE_AVALANCHE_CHAIN_ID:-43113}
    container_name: isbjorn_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - isbjorn_network
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: true

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: isbjorn_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/ssl/certs
      - ./logs/nginx:/var/log/nginx
    networks:
      - isbjorn_network
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  isbjorn_network:
    driver: bridge